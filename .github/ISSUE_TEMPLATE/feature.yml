name: Proponi una funzionalità
description: Una capacità nuova, o il miglioramento di una esistente.
type: Feature
body:
  - type: markdown
    attributes:
      value: >-
        Prima il problema, poi la soluzione. Il titolo descrive l'esito atteso, non l'attività; le
        regole complete sono nella sezione Issue di
        [CONTRIBUTING.md](https://github.com/YoZoLabs/.github/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Che cosa non funziona, o manca, per chi lo chiede.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Soluzione proposta
      description: Come risolverlo.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative considerate
      description: Le altre strade valutate, e perché sono state scartate.
  - type: textarea
    id: acceptance
    attributes:
      label: Criteri di accettazione
      description: >-
        Un elenco puntato, senza caselle, di criteri verificabili — un comando, un test, uno
        screenshot.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: File toccati e documento da aggiornare
      description: I file che cambieranno e il documento che possiede l'informazione toccata.
