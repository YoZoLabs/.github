name: Segnala un bug
description: Il sistema si comporta in modo diverso da quello atteso.
type: Bug
body:
  - type: markdown
    attributes:
      value: >-
        Il titolo descrive l'esito atteso, non l'attività. Le regole complete sono nella sezione
        Issue di [CONTRIBUTING.md](https://github.com/YoZoLabs/.github/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: observed
    attributes:
      label: Comportamento osservato
      description: >-
        Che cosa succede. In un repository di codice almeno un percorso reale in forma `file:riga`;
        altrove un link o un fatto verificabile.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento atteso
      description: Come si comporta il sistema quando la issue è chiusa.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Come riprodurre
      description: I passi minimi, con i dati che servono.
      placeholder: |
        1. …
        2. …
  - type: textarea
    id: acceptance
    attributes:
      label: Criteri di accettazione
      description: Verificabili — un comando, un test, uno screenshot.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: File toccati e documento da aggiornare
      description: I file che cambieranno e il documento che possiede l'informazione toccata.
