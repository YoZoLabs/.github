name: Apri un task
description: Lavoro che non cambia il comportamento — manutenzione, strumenti, documenti, decisioni.
type: Task
body:
  - type: markdown
    attributes:
      value: >-
        Il titolo descrive l'esito atteso, non l'attività. Una issue madre (fase di consegna, lavoro
        su più repository) usa altre sezioni: sono nella sezione Issue di
        [CONTRIBUTING.md](https://github.com/YoZoLabs/.github/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: context
    attributes:
      label: Contesto
      description: >-
        Che cosa c'è oggi. In un repository di codice almeno un percorso reale in forma
        `file:riga`; altrove un link o un fatto verificabile.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Esito atteso
      description: Che cosa è vero quando la issue è chiusa.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criteri di accettazione
      description: Verificabili — un comando, un test, uno screenshot.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: File toccati e documento da aggiornare
      description: I file che cambieranno e il documento che possiede l'informazione toccata.
