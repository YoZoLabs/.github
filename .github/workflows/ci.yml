name: ci

# Il repository controlla i propri workflow con il proprio workflow di igiene: stessa chiamata dei
# repository che lo usano (vedi README, sezione CI riusabile), più il push su main, che controlla
# anche i commit arrivati senza passare da una PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

# Ogni push ha un gruppo suo: nello stesso gruppo resta in attesa una sola esecuzione, e una
# intermedia verrebbe annullata senza che il suo intervallo venga mai più scansionato. Una modifica
# al solo corpo della PR ha anch'essa un gruppo suo: non annulla mai l'esecuzione in corso.
concurrency:
  group: ${{ github.event_name == 'push' && format('push-{0}', github.sha) || ((github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base) && format('noop-{0}', github.run_id) || format('hygiene-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    # Solo il corpo della PR è cambiato: niente da controllare.
    if: github.event.action != 'edited' || github.event.changes.title || github.event.changes.base
    # `./` e non la sintassi `$/` che zizmor suggerisce: actionlint 1.7.12 non la riconosce e la
    # darebbe per errore. Un workflow riusabile dello stesso repository GitHub lo legge dal commit
    # dell'evento, non dal disco del runner.
    uses: ./.github/workflows/hygiene.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read # quelli che chiede il job `checks` di hygiene.yml, non uno di più
      pull-requests: read # il controllo del titolo rilegge la PR via API
